# Levers for the per-project Claude Code account selector.
#
# Identity data — which account belongs in which slot — is deliberately NOT in
# this file. It lives in ~/.config/claude-accounts/accounts.conf, outside this
# repo, and is sourced after this one. Slot names encode the GitHub org they
# serve, and this repo is public.

# Read each account's usage and fail over between them (1), or always take the
# first account in the pool (0).
USAGE_AWARE=1

# Skip an account once its usage reaches this percentage.
USAGE_THRESHOLD=95

# Which window the threshold applies to: five_hour, seven_day, or max.
USAGE_METRIC=max

# How long a usage reading is trusted before re-asking the API.
USAGE_CACHE_TTL=600

# How long an EXPIRED reading may still be trusted when the live re-check fails.
# This bound has to exist: a skipped account never has a session launched under
# it, so its OAuth token never refreshes, so every check keeps failing. Without
# a cutoff, one stale "capped" reading locks an account out permanently.
USAGE_STALE_MAX=3600

# May a repo belonging to a known org fall back to the DEFAULT account when its
# whole pool is over threshold?
#
# Keep this 0. `/login` writes credentials into whatever config dir the session
# is ALREADY under, so an org repo running on the default slot turns the next
# login prompt into a silent identity swap: you answer it with your work account
# because you are sitting in a work repo, and every personal repo inherits that
# credential. Staying inside the pool means a login there can only ever write to
# an org slot. For a real second tier, add ~/.claude-<org>-2 and log into it with
# the account you want as the fallback.
ORG_FALLBACK_DEFAULT=0

# Abort the launch when a slot holds an account other than the one pinned to it
# in the private config. Backstops the one hole ORG_FALLBACK_DEFAULT cannot
# close: choosing the wrong account at the browser prompt.
IDENTITY_GUARD=1

# Print the slot and its expected account on every launch. A mid-session re-auth
# prompt gives no clue which account it wants, so the answer has to already be
# in the scrollback before the prompt can appear.
ANNOUNCE_ACCOUNT=1

# Usage and identity checks need a profile-scoped OAuth token. On macOS the
# Keychain holds one per config dir, written automatically by the first
# interactive /login. `claude setup-token` is not a substitute — its token lacks
# the user:profile scope. Without a readable token an account is used unchecked,
# never skipped on a guess.
