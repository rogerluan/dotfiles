# claude-accounts.conf — the levers for the per-project Claude account selector.
#
# This is the ONLY file you edit to tune account selection. It's plain shell
# `KEY=value` (sourced by claude-pick-account), so just change the value to the
# right of each `=`. Lines starting with `#` are comments.
#
# ── How selection works (the big picture) ────────────────────────────────────
#   • A repo's GitHub org maps to a pool of accounts on disk:
#       ~/.claude-<org>-1 , ~/.claude-<org>-2 , …   (tried lowest-number first)
#   • For each account, the selector reads how much of its usage limit is
#     already spent. If that's AT OR OVER `USAGE_THRESHOLD`, it moves on to the
#     next account. The first account UNDER the threshold is the one used.
#   • If every account in the pool is over the threshold, it falls back to the
#     default account (your personal ~/.claude).
#   • Reading an account's usage needs that account's token on file (see the
#     "Tokens" note at the bottom). If usage can't be read, the account is used
#     as-is — it is never skipped on a guess.
# ─────────────────────────────────────────────────────────────────────────────

# Master switch for usage-based fail-over.
#   1 = read usage and fail over between accounts as described above
#   0 = always use account #1 in the pool, never call the usage API
USAGE_AWARE=1

# Skip an account once its usage reaches this percentage (0–100).
# Example: 95 means "as soon as an account is 95% used, move to the next one".
USAGE_THRESHOLD=95

# Which usage window the threshold is compared against:
#   five_hour  = the rolling 5-hour session limit only
#   seven_day  = the weekly limit only
#   max        = whichever of the two is higher (most conservative — recommended)
USAGE_METRIC=max

# How long (in seconds) a usage reading is trusted before the API is asked
# again. Higher = fewer API calls and faster launches; lower = fresher numbers.
USAGE_CACHE_TTL=600

# How long (in seconds) an EXPIRED reading may still be used as a fallback when
# the live re-check fails (e.g. the usage endpoint's own rate limit). Past this
# age the reading is discarded and the account is used as-is — never skipped on
# data this old. This bound matters: an account skipped for being "capped" never
# gets a session launched under it, so its OAuth token is never refreshed, so
# usage checks keep failing — without this cutoff one old "100%" reading would
# lock the account out of the pool forever, even long after the limit reset.
# Keep this >= USAGE_CACHE_TTL.
USAGE_STALE_MAX=3600

# ── Tokens (needed for usage fail-over on non-default accounts) ───────────────
# macOS Keychain stores one item per CLAUDE_CONFIG_DIR (named
# "Claude Code-credentials-<sha256(dir)[:8]>"), populated automatically the
# first time you interactively `/login` under that config dir — nothing to set
# up by hand. `claude setup-token` does NOT work as a substitute: that token
# lacks the `user:profile` scope this usage endpoint requires.
# A manual token file (~/.config/claude-accounts/<basename of
# CLAUDE_CONFIG_DIR>.token, chmod 600) is still honored as an override, e.g. on
# Linux where there's no Keychain — but it must be a profile-scoped token.
# Without any readable token, that account is simply used without a usage check.
